name: CI

# Required checks for merging (docs/operations/CI_CD.md). Each job is one gate.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests (repo root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            ai/requirements.txt
      - name: Install Tesseract (real OCR test on a scanned page)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install CPU-only PyTorch (ai/rag needs sentence-transformers)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install dependencies
        run: python -m pip install -e "apps/api[dev,cv,ingestion,ocr,observability]" -r ai/requirements.txt
      - name: Lint (ruff.toml)
        run: ruff check .
      - name: Source registry validates against its schema
        run: python knowledge/ingestion/validate_registry.py
      - name: API_SCHEMAS.md is current with openapi.json
        run: python docs/tools/render_api_schemas.py --check
      - name: Tests (tests/ and apps/api/tests, one command)
        run: python -m pytest

  migrations:
    name: Migrations, seed and ingest on PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: flame
          POSTGRES_USER: flame
          POSTGRES_PASSWORD: flame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flame -d flame"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FLAME_API_AUTH_ENABLED: "false"
      FLAME_DATABASE_URL: postgresql+psycopg://flame:flame@localhost:5432/flame
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[cv,ingestion]"
      - name: alembic upgrade head
        working-directory: apps/api
        run: alembic upgrade head
      - name: Downgrade and re-apply the newest migration
        working-directory: apps/api
        run: alembic downgrade -1 && alembic upgrade head
      - name: Seed and ingest (committed sources only; git-ignored mirrors are skipped)
        working-directory: apps/api
        run: |
          python -m flame_api.seed
          python -m flame_api.ingest
          python -m flame_api.ingest   # idempotent: a second run creates nothing new
      - name: Lexical OR/IDF full-text SQL and the window index on real PostgreSQL + pgvector
        working-directory: ${{ github.workspace }}
        env:
          FLAME_TEST_PG_URL: postgresql+psycopg://flame:flame@localhost:5432/flame
        run: |
          python -m pip install -e "apps/api[dev]"
          python -m pytest apps/api/tests/test_lexical_postgres.py apps/api/tests/test_window_index_postgres.py -p no:cacheprovider -rs

  web:
    name: Web lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0 (checksum-pinned)
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan
        run: /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .
