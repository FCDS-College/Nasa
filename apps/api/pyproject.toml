[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flame-in-freefall-api"
version = "0.1.0"
description = "Contract-first API for Flame in Freefall"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "rq>=2,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "jsonschema[format-nongpl]>=4.23,<5",
  "ruff>=0.6,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
cv = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=13,<14",  # 13.0.0 fixes 39 CVEs in 12.x decoders; uploads are untrusted
]
vector = [
  "fastembed>=0.4,<1",
]
ingestion = [
  "pymupdf>=1.24,<2",
  "xlrd>=2,<3",
]
# OCR fallback for scanned PDF pages (M9). Also needs the `tesseract` binary on the host.
ocr = [
  "pytesseract>=0.3.10,<1",
]
# OpenTelemetry spans (M12, L-9). No-op unless installed and FLAME_OTEL_ENABLED=true.
observability = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flame_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root holds the `ai` (provider contracts, router) and `cv` packages flame_api imports.
pythonpath = ["../..", ".", "tests"]
addopts = "-q"
