[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flame-in-freefall-api"
version = "0.1.0"
description = "Contract-first API for Flame in Freefall"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "rq>=2,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
cv = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
]
vector = [
  "fastembed>=0.4,<1",
]
ingestion = [
  "pymupdf>=1.24,<2",
  "xlrd>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flame_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
