name: flame-in-freefall

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: flame
      POSTGRES_USER: flame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flame-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flame -d flame"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flame-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done; mc mb --ignore-existing local/flame-artifacts'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flame-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      FLAME_ENVIRONMENT: development
      FLAME_API_AUTH_ENABLED: ${FLAME_API_AUTH_ENABLED:-true}
      FLAME_READ_API_TOKEN: ${FLAME_READ_API_TOKEN:?Set FLAME_READ_API_TOKEN in infrastructure/.env}
      FLAME_WRITE_API_TOKEN: ${FLAME_WRITE_API_TOKEN:?Set FLAME_WRITE_API_TOKEN in infrastructure/.env}
      FLAME_AURA_ENABLED: ${FLAME_AURA_ENABLED:-false}
      FLAME_AURA_BASE_URL: ${FLAME_AURA_BASE_URL:-https://aura-ai-production-03a4.up.railway.app}
      FLAME_AURA_SERVICE_TOKEN: ${FLAME_AURA_SERVICE_TOKEN:-}
      FLAME_DATABASE_URL: postgresql+psycopg://flame:${POSTGRES_PASSWORD:-flame-local-only}@postgres:5432/flame
      FLAME_REDIS_URL: redis://redis:6379/0
      FLAME_S3_ENDPOINT_URL: http://minio:9000
      FLAME_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flame-local}
      FLAME_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}
      FLAME_S3_BUCKET: flame-artifacts
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../datasets:/app/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "alembic upgrade head && python -m flame_api.seed && python -m flame_api.ingest && uvicorn flame_api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/api/health',
          headers={'Authorization': 'Bearer ' + os.environ['FLAME_READ_API_TOKEN']});
          urllib.request.urlopen(request, timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      FLAME_ENVIRONMENT: development
      FLAME_API_AUTH_ENABLED: "false"
      FLAME_AURA_ENABLED: ${FLAME_AURA_ENABLED:-false}
      FLAME_AURA_BASE_URL: ${FLAME_AURA_BASE_URL:-https://aura-ai-production-03a4.up.railway.app}
      FLAME_AURA_SERVICE_TOKEN: ${FLAME_AURA_SERVICE_TOKEN:-}
      FLAME_DATABASE_URL: postgresql+psycopg://flame:${POSTGRES_PASSWORD:-flame-local-only}@postgres:5432/flame
      FLAME_REDIS_URL: redis://redis:6379/0
      FLAME_S3_ENDPOINT_URL: http://minio:9000
      FLAME_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flame-local}
      FLAME_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}
      FLAME_S3_BUCKET: flame-artifacts
    volumes:
      - ../datasets:/app/datasets:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "flame-analysis"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data: