name: flame-in-freefall

# Sub-phase 2H model routing (docs/hybrid-ai/PHASE_2_HYBRID_AI_ARCHITECTURE.md). Shared by api and worker.
x-ai-env: &ai-env
  FLAME_AI_EXECUTION_MODE: ${FLAME_AI_EXECUTION_MODE:-local_first}
  FLAME_OLLAMA_BASE_URL: ${FLAME_OLLAMA_BASE_URL:-}
  FLAME_OLLAMA_MODEL: ${FLAME_OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_K_M}
  FLAME_VLLM_BASE_URL: ${FLAME_VLLM_BASE_URL:-}
  FLAME_VLLM_MODEL: ${FLAME_VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
  FLAME_LLAMACPP_BASE_URL: ${FLAME_LLAMACPP_BASE_URL:-}
  FLAME_LLM_TIMEOUT_S: ${FLAME_LLM_TIMEOUT_S:-180}
  FLAME_EMBEDDING_CACHE_DIR: /app/models/fastembed
  FLAME_EMBEDDING_OFFLINE: ${FLAME_EMBEDDING_OFFLINE:-false}
  FLAME_OTEL_ENABLED: ${FLAME_OTEL_ENABLED:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: flame
      POSTGRES_USER: flame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flame-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flame -d flame"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible artifact store. The MinIO images this used to pin are no longer published on Docker Hub or
  # quay.io (pull access denied, checked 2026-11-13), so it is SeaweedFS's S3 gateway, kept under the service name
  # `minio` so every FLAME_S3_* setting still points at http://minio:9000. The identities config makes the gateway
  # accept only the MINIO_ROOT_* key pair from .env (as MinIO did). The port stays loopback-only.
  minio:
    image: chrislusf/seaweedfs:4.53
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=20"]
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Creates the artifact bucket once the store answers (idempotent).
  minio-init:
    image: amazon/aws-cli@sha256:acc32af784911165a8e78b63950625d174ba79b800a66a436c974689c87cd755  # aws-cli/2.40.2
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'until aws --endpoint-url http://minio:9000 s3api head-bucket --bucket flame-artifacts 2>/dev/null || aws --endpoint-url http://minio:9000 s3 mb s3://flame-artifacts; do sleep 2; done; echo bucket ready'
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-flame-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}
      AWS_DEFAULT_REGION: us-east-1

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: flame-in-freefall-api:latest    # also run by the one-off `ingest` service
    environment:
      FLAME_ENVIRONMENT: development
      FLAME_API_AUTH_ENABLED: ${FLAME_API_AUTH_ENABLED:-true}
      FLAME_READ_API_TOKEN: ${FLAME_READ_API_TOKEN:?Set FLAME_READ_API_TOKEN in infrastructure/.env}
      FLAME_WRITE_API_TOKEN: ${FLAME_WRITE_API_TOKEN:?Set FLAME_WRITE_API_TOKEN in infrastructure/.env}
      FLAME_AURA_ENABLED: ${FLAME_AURA_ENABLED:-false}
      FLAME_AURA_BASE_URL: ${FLAME_AURA_BASE_URL:-https://aura-ai-production-03a4.up.railway.app}
      FLAME_AURA_SERVICE_TOKEN: ${FLAME_AURA_SERVICE_TOKEN:-}
      FLAME_AURA_REQUIRE_LOCAL: ${FLAME_AURA_REQUIRE_LOCAL:-true}
      FLAME_CV_PROVIDER: ${FLAME_CV_PROVIDER:-local}
      FLAME_CV_HF_SPACE_URL: ${FLAME_CV_HF_SPACE_URL:-}
      FLAME_CV_HF_TOKEN: ${FLAME_CV_HF_TOKEN:-}
      FLAME_CV_TIMEOUT_S: ${FLAME_CV_TIMEOUT_S:-300}
      FLAME_DATABASE_URL: postgresql+psycopg://flame:${POSTGRES_PASSWORD:-flame-local-only}@postgres:5432/flame
      FLAME_REDIS_URL: redis://redis:6379/0
      FLAME_S3_ENDPOINT_URL: http://minio:9000
      FLAME_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flame-local}
      FLAME_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}
      FLAME_S3_BUCKET: flame-artifacts
      <<: *ai-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../datasets:/app/datasets:ro
      - model-cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Migrations and the server only. Loading data is the one-off `ingest` service below, so the API is up in
    # seconds and serves what is already in the database while new files are parsed (a first OCR pass over new
    # PDFs can take hours). It picks up the new data when the ingest commits: caches key on the knowledge version.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn flame_api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/api/health',
          headers={'Authorization': 'Bearer ' + os.environ['FLAME_READ_API_TOKEN']});
          urllib.request.urlopen(request, timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-off data load: seed the registry and file checksums, parse every registered file, then build the vector
  # index. Runs once per `docker compose up` and exits; it never blocks the API. Unchanged files are skipped (same
  # bytes + same parser version), so a re-run after a restart takes seconds; new or re-versioned files are parsed.
  # Waits for a healthy API, which has applied the migrations. Re-run by hand after acquiring data:
  #   docker compose -f infrastructure/compose.yaml run --rm ingest
  # The vector index makes search hybrid (hit@1 0.81 vs 0.31 lexical-only: docs/evaluation/reports/retrieval-2026-11-07.md);
  # a failed build (e.g. offline without the embedding cache) leaves search lexical instead of failing the load.
  ingest:
    image: flame-in-freefall-api:latest    # the image the `api` service builds; never pulled from a registry
    pull_policy: never
    environment:
      FLAME_ENVIRONMENT: development
      FLAME_API_AUTH_ENABLED: ${FLAME_API_AUTH_ENABLED:-true}
      FLAME_READ_API_TOKEN: ${FLAME_READ_API_TOKEN:?Set FLAME_READ_API_TOKEN in infrastructure/.env}
      FLAME_WRITE_API_TOKEN: ${FLAME_WRITE_API_TOKEN:?Set FLAME_WRITE_API_TOKEN in infrastructure/.env}
      FLAME_DATABASE_URL: postgresql+psycopg://flame:${POSTGRES_PASSWORD:-flame-local-only}@postgres:5432/flame
      FLAME_REDIS_URL: redis://redis:6379/0
      FLAME_S3_ENDPOINT_URL: http://minio:9000
      FLAME_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flame-local}
      FLAME_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}
      FLAME_S3_BUCKET: flame-artifacts
      <<: *ai-env
    volumes:
      - ../datasets:/app/datasets:ro
      - model-cache:/app/models
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "python -m flame_api.ingest && (python -m flame_api.vector_index build || echo 'vector index build failed; search stays lexical-only')"]
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      FLAME_ENVIRONMENT: development
      FLAME_API_AUTH_ENABLED: "false"
      FLAME_AURA_ENABLED: ${FLAME_AURA_ENABLED:-false}
      FLAME_AURA_BASE_URL: ${FLAME_AURA_BASE_URL:-https://aura-ai-production-03a4.up.railway.app}
      FLAME_AURA_SERVICE_TOKEN: ${FLAME_AURA_SERVICE_TOKEN:-}
      FLAME_AURA_REQUIRE_LOCAL: ${FLAME_AURA_REQUIRE_LOCAL:-true}
      FLAME_CV_PROVIDER: ${FLAME_CV_PROVIDER:-local}
      FLAME_CV_HF_SPACE_URL: ${FLAME_CV_HF_SPACE_URL:-}
      FLAME_CV_HF_TOKEN: ${FLAME_CV_HF_TOKEN:-}
      FLAME_CV_TIMEOUT_S: ${FLAME_CV_TIMEOUT_S:-300}
      FLAME_DATABASE_URL: postgresql+psycopg://flame:${POSTGRES_PASSWORD:-flame-local-only}@postgres:5432/flame
      FLAME_REDIS_URL: redis://redis:6379/0
      FLAME_S3_ENDPOINT_URL: http://minio:9000
      FLAME_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flame-local}
      FLAME_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}
      FLAME_S3_BUCKET: flame-artifacts
      <<: *ai-env
    volumes:
      - ../datasets:/app/datasets:ro
      - model-cache:/app/models
    depends_on:
      api:
        condition: service_healthy
    # P2-4: re-queue analyses a dead worker left in `processing` (idempotent; safe with several workers).
    command: ["sh", "-c", "python -m flame_api.worker recover || echo 'stuck-job recovery failed; starting the worker anyway'; exec rq worker --url redis://redis:6379/0 flame-analysis"]
    restart: unless-stopped

  # Local LLM runtime (2H Task 4). Opt in with `COMPOSE_PROFILES=local-llm` and
  # FLAME_OLLAMA_BASE_URL=http://ollama:11434. No published port: only containers on this
  # project's network can reach it (2H Task 9). Pull the model once, while connected:
  #   docker compose --profile local-llm run --rm ollama-pull
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm-setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${FLAME_OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  model-cache:
  ollama-models:

configs:
  # SeaweedFS S3 identities: the one key pair the `minio` service accepts, from .env.
  seaweedfs-s3:
    content: |
      {"identities": [{"name": "flame",
        "credentials": [{"accessKey": "${MINIO_ROOT_USER:-flame-local}",
                         "secretKey": "${MINIO_ROOT_PASSWORD:-flame-local-only-change-me}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}