name: Evaluation Pipeline Gates

on:
  push:
    branches: [ main, Ziad, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-gates:
    name: Run Evaluation & Provenance Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Evaluation Gates
        run: |
          pytest tests/eval/ -v --durations=10

      - name: Run Full Benchmark Evaluation & Render Reports
        run: |
          python run_evaluation.py --model mock
          python render_report.py

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            evaluation_report.json
            scorecard.html
            docs/evaluation/reports/baseline-v0.1.0-mvp.md
