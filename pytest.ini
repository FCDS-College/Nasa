# One repo-root test command (Phase 2 M12, L-7): `python -m pytest` runs both trees.
# importlib mode lets tests/unit/test_ingestion.py and apps/api/tests/test_ingestion.py coexist;
# pythonpath makes `ai`, `cv` and `flame_api` importable without an editable install.
[pytest]
testpaths = tests apps/api/tests
pythonpath = . apps/api apps/api/tests
addopts = -q --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning:jsonschema
